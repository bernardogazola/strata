name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/package.yml
      - .gitattributes
      - package.json
      - pnpm-lock.yaml
      - scripts/build-analyzer.*
      - scripts/smoke-packaged.sh
      - scripts/sign-macos.sh
      - analyzer/pom.xml
      - analyzer/runtime-modules.txt
      - analyzer/src/main/java/br/pucpr/tcc/strata/analyzer/bootstrap/**
      - src-tauri/**
      - "!src-tauri/target/**"
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 26.10.0
  RUST_TOOLCHAIN: 1.99.0

jobs:
  package:
    name: package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, label: windows-x86_64 }
          - { os: macos-26, label: macos-arm64 }
          - { os: ubuntu-24.04, label: linux-x86_64 }
    steps:
      # O git do executor Windows vem com core.autocrlf=true; sem isto, arquivos sem eol no
      # .gitattributes chegariam com CRLF.
      - name: No CRLF conversion on checkout
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: WebKitGTK and the Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package (macOS app)
        if: runner.os == 'macOS'
        run: pnpm package --bundles app

      - name: Package (Linux deb)
        if: runner.os == 'Linux'
        run: pnpm package --bundles deb

      - name: Package (Windows NSIS)
        if: runner.os == 'Windows'
        run: pnpm package --bundles nsis

      - name: Sign ad hoc and build the dmg
        if: runner.os == 'macOS'
        run: |
          bash scripts/sign-macos.sh --self-test
          bash scripts/sign-macos.sh

      - name: The deb installs and links on a clean Ubuntu 24.04
        if: runner.os == 'Linux'
        run: |
          cat > "$RUNNER_TEMP/check-deb.sh" <<'CHECK'
          set -eu
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends /deb/*.deb >/dev/null
          missing=""
          for binary in /usr/bin/strata /usr/lib/Strata/analyzer/runtime/bin/java \
            /usr/lib/Strata/analyzer/runtime/lib/server/libjvm.so; do
            [ -e "$binary" ] || { echo "missing from the installed deb: $binary"; exit 1; }
            unresolved="$(ldd "$binary" | grep 'not found' || true)"
            [ -z "$unresolved" ] || missing="$missing $binary: $unresolved"
          done
          [ -z "$missing" ] || { echo "unresolved on a clean Ubuntu 24.04:$missing"; exit 1; }
          echo "the deb installs on a clean Ubuntu 24.04 and every binary links"
          CHECK
          docker run --rm \
            -v "$PWD/src-tauri/target/release/bundle/deb:/deb:ro" \
            -v "$RUNNER_TEMP/check-deb.sh:/check-deb.sh:ro" \
            ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55 \
            sh /check-deb.sh

      - name: Packaged smoke
        run: |
          record="$RUNNER_TEMP/startup-${{ matrix.label }}.json"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a bash scripts/smoke-packaged.sh --ci --record-to "$record"
          else
            bash scripts/smoke-packaged.sh --ci --record-to "$record"
          fi

      - name: Rust tests on this system
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: The packaged runtime decodes a non-ASCII data directory
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export STRATA_ANALYZER_HOME="$(cygpath -w "$PWD/src-tauri/resources/analyzer")"
          else
            export STRATA_ANALYZER_HOME="$PWD/src-tauri/resources/analyzer"
          fi
          cargo test --manifest-path src-tauri/Cargo.toml --test packaged_runtime -- --ignored --nocapture
          if [ "$RUNNER_OS" != "Windows" ]; then
            env -u LANG -u LC_ALL -u LC_CTYPE \
              cargo test --manifest-path src-tauri/Cargo.toml --test packaged_runtime -- --ignored --nocapture
          fi

      - name: Collect the installer and its checksum
        run: |
          out="$RUNNER_TEMP/strata-${{ matrix.label }}"
          mkdir -p "$out"
          case "$RUNNER_OS" in
            macOS) cp src-tauri/target/release/bundle/dmg/*.dmg "$out/" ;;
            Linux) cp src-tauri/target/release/bundle/deb/*.deb "$out/" ;;
            Windows) cp src-tauri/target/release/bundle/nsis/*-setup.exe "$out/" ;;
          esac
          cd "$out"
          installer="$(ls)"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- "$installer" > SHA256SUMS
          else
            shasum -a 256 -- "$installer" > SHA256SUMS
          fi
          cp "$RUNNER_TEMP/startup-${{ matrix.label }}.json" .
          cat SHA256SUMS
          { echo "### ${{ matrix.label }}"; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strata-${{ matrix.label }}
          path: ${{ runner.temp }}/strata-${{ matrix.label }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
