name: pr

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 26.10.0
  RUST_TOOLCHAIN: 1.99.0

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format (Biome via Ultracite)
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate the fixture repositories
        run: bash scripts/make-fixtures.sh

      - name: Test, with the coverage floor
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: The build left the tree as it found it
        run: |
          changed="$(git status --porcelain)"
          if [ -n "$changed" ]; then
            printf '%s\n' "the build modified tracked files:" "$changed" >&2
            git diff >&2
            exit 1
          fi

  java:
    name: java
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: mvnw verify, jdeps against the module baseline, jlink, handshake
        run: bash scripts/build-analyzer.sh

  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: WebKitGTK and the Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: The analyzer jar the development fallback resolves
        working-directory: analyzer
        run: ./mvnw --batch-mode --no-transfer-progress --quiet package -DskipTests

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy -D warnings
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo test, with JVM-injection variables in the parent
        env:
          JAVA_TOOL_OPTIONS: -Dstrata.poison=1
          _JAVA_OPTIONS: -Dstrata.poison=1
          JDK_JAVA_OPTIONS: -Dstrata.poison=1
          CLASSPATH: /strata-poison
        run: cargo test --manifest-path src-tauri/Cargo.toml --test lifecycle

  protocol:
    name: protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The checkers can fail
        run: |
          bash scripts/verify-fixtures.sh --self-test
          bash scripts/make-fixtures.sh --self-test
          bash scripts/corpus.sh --self-test
          bash scripts/smoke-packaged.sh --self-test
          bash scripts/verify-analysis.sh --self-test

      - name: Regenerate the fixture repositories and compare commit ids
        run: |
          bash scripts/make-fixtures.sh
          bash scripts/make-fixtures.sh --print-ids | diff -u fixtures/repositories/commits.txt -

      - name: Fixtures, byte by byte and by inventory
        run: bash scripts/verify-fixtures.sh --expect-git

      - name: Regeneration changed no tracked file
        run: |
          changed="$(git status --porcelain -- fixtures protocol)"
          if [ -n "$changed" ]; then
            printf '%s\n' "make-fixtures.sh changed tracked fixture files:" "$changed" >&2
            exit 1
          fi

  security:
    name: security
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml
