[package]
name = "strata"
version = "0.1.0"
description = "Ferramenta local-first de arqueologia de código para onboarding em bases legadas Java"
authors = ["Bernardo Gazola"]
edition = "2024"

[lib]
name = "strata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

